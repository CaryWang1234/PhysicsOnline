{% extends "base.html" %}
{% block title %}注册 · PhysicsOnline{% endblock %}

{% block content %}
<section class="auth-card paper-card">
  <h1>🌱 注册新账号</h1>
  <p class="auth-sub">只需用户名和密码，不用邮箱手机号。注册后自动登录。</p>

  {% if error %}<p class="auth-error">⚠ {{ error }}</p>{% endif %}

  <form method="post" class="auth-form">
    <label>用户名（2～16 个字符，可以是中文）
      <input type="text" name="username" minlength="2" maxlength="16" required autofocus placeholder="给自己起个名字">
    </label>
    <label>密码（至少 4 位）
      <input type="password" name="password" minlength="4" required placeholder="设一个密码">
    </label>
    <label>再输一遍密码
      <input type="password" name="confirm" minlength="4" required placeholder="确认密码">
    </label>
    <button type="submit" class="btn-done">✨ 注册并开始学习</button>
  </form>

  <p class="auth-alt">已经有账号了？<a href="/login">直接登录</a></p>
  <p class="auth-note">注册成功后，之前在本浏览器里做过的测验成绩会自动合并到你的账号里。</p>
</section>
{% endblock %}
